<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎯 Зорилгын Зам</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d0d1a;color:#e8e0ff;font-family:Georgia,serif;min-height:100vh;padding:16px 14px 80px;}
.wrap{max-width:480px;margin:0 auto;}

/* Header */
.header{text-align:center;padding:24px 0 20px;border-bottom:1px solid #1e1a3a;margin-bottom:20px;}
.header h1{font-size:24px;font-weight:700;color:#a78bfa;}
.header p{font-size:13px;color:#6b5fa0;font-style:italic;margin-top:4px;}

/* Player */
.player{background:linear-gradient(135deg,#1a1035,#0d1a2e);border:1px solid #3d2a7a;border-radius:14px;padding:18px;margin-bottom:18px;}
.player-row{display:flex;align-items:center;gap:14px;margin-bottom:14px;}
.avatar{font-size:44px;}
.player-info{flex:1;}
.player-title{font-size:17px;font-weight:700;color:#c4b5fd;}
.player-sub{font-family:monospace;font-size:11px;color:#7c6ab0;letter-spacing:1px;margin-top:2px;}
.xp-label{display:flex;justify-content:space-between;margin-bottom:5px;}
.xp-label span{font-family:monospace;font-size:11px;color:#7c6ab0;}
.xp-label strong{font-family:monospace;font-size:11px;color:#a78bfa;}
.xp-track{height:10px;background:#1a1035;border-radius:5px;overflow:hidden;border:1px solid #2d1a5a;}
.xp-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:5px;transition:width 0.6s;}
.badges-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.badge{padding:4px 10px;border-radius:12px;font-size:10px;font-family:monospace;border:1px solid;}
.badge.on{background:rgba(167,139,250,0.2);border-color:#7c3aed;color:#c4b5fd;}
.badge.off{background:rgba(40,30,70,0.2);border-color:#2d1a5a;color:#3d2a5a;}

/* Tabs */
.tabs{display:flex;gap:6px;background:#110d22;padding:6px;border-radius:12px;border:1px solid #1e1a3a;margin-bottom:18px;}
.tab{flex:1;padding:10px 4px;border:none;border-radius:8px;background:transparent;color:#6b5fa0;font-family:monospace;font-size:11px;cursor:pointer;letter-spacing:1px;transition:all 0.2s;}
.tab.active{background:#7c3aed;color:#fff;font-weight:700;}
.panel{display:none;}
.panel.active{display:block;}

/* Goal card */
.goal-card{background:#110d22;border:1px solid #1e1a3a;border-radius:12px;padding:16px;margin-bottom:12px;position:relative;}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;}
.goal-title{font-size:15px;font-weight:700;color:#e8e0ff;flex:1;margin-right:8px;}
.goal-pts{font-family:monospace;font-size:11px;color:#a78bfa;background:#1e1a3a;padding:3px 10px;border-radius:10px;white-space:nowrap;}
.goal-meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.goal-tag{font-family:monospace;font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #2d1a5a;color:#7c6ab0;}
.goal-deadline{font-family:monospace;font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid #2d1a5a;color:#7c6ab0;}
.goal-prog-label{display:flex;justify-content:space-between;margin-bottom:5px;}
.goal-prog-label span{font-size:12px;color:#7c6ab0;}
.goal-prog-label strong{font-family:monospace;font-size:12px;color:#a78bfa;}
.prog-track{height:8px;background:#0d0d1a;border-radius:4px;overflow:hidden;margin-bottom:10px;}
.prog-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:4px;transition:width 0.4s;}
.goal-btns{display:flex;gap:8px;}
.btn-plus{flex:1;padding:10px;background:#7c3aed;border:none;border-radius:8px;color:#fff;font-family:monospace;font-size:12px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-plus:active{transform:scale(0.96);}
.btn-minus{padding:10px 14px;background:transparent;border:1px solid #2d1a5a;border-radius:8px;color:#6b5fa0;font-family:monospace;font-size:12px;cursor:pointer;}
.btn-del{padding:10px 12px;background:transparent;border:1px solid #2d1a5a;border-radius:8px;color:#5a3a5a;font-size:14px;cursor:pointer;}
.goal-done{border-color:#4a3a7a;opacity:0.6;}
.done-stamp{position:absolute;top:12px;right:12px;font-family:monospace;font-size:10px;color:#4ade80;letter-spacing:1px;}

/* Add goal form */
.add-box{background:#110d22;border:1px solid #1e1a3a;border-radius:12px;padding:16px;margin-bottom:12px;}
.add-box label{font-family:monospace;font-size:10px;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:8px;}
.add-box input,.add-box select{width:100%;background:#0d0d1a;border:1px solid #2d1a5a;border-radius:8px;color:#e8e0ff;font-family:Georgia,serif;font-size:14px;padding:10px 12px;outline:none;margin-bottom:12px;}
.add-box input:focus,.add-box select:focus{border-color:#7c3aed;}
.add-box input::placeholder{color:#3d2a5a;font-style:italic;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.add-btn{width:100%;padding:14px;background:#7c3aed;border:none;border-radius:10px;color:#fff;font-family:monospace;font-size:13px;font-weight:700;letter-spacing:2px;cursor:pointer;margin-top:4px;}

/* Rewards */
.rewards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.reward-card{background:#110d22;border:1px solid #1e1a3a;border-radius:12px;padding:14px;text-align:center;position:relative;}
.reward-card.unlocked{border-color:#7c3aed;background:rgba(124,58,237,0.1);}
.reward-icon{font-size:36px;margin-bottom:8px;}
.reward-name{font-size:13px;font-weight:700;color:#c4b5fd;margin-bottom:4px;}
.reward-pts{font-family:monospace;font-size:11px;color:#7c6ab0;}
.reward-lock{position:absolute;top:8px;right:8px;font-size:14px;}
.reward-card.unlocked .reward-lock{display:none;}

/* Stats */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.stat-box{background:#110d22;border:1px solid #1e1a3a;border-radius:12px;padding:16px;text-align:center;}
.stat-n{font-family:monospace;font-size:36px;font-weight:700;color:#a78bfa;}
.stat-l{font-size:12px;color:#6b5fa0;font-style:italic;margin-top:4px;}
.chart-box{background:#110d22;border:1px solid #1e1a3a;border-radius:12px;padding:16px;}
.chart-title{font-family:monospace;font-size:10px;color:#a78bfa;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;}
.chart-row{margin-bottom:12px;}
.chart-lbl{display:flex;justify-content:space-between;font-size:12px;color:#7c6ab0;margin-bottom:4px;}
.chart-lbl strong{color:#a78bfa;font-family:monospace;}
.chart-track{height:8px;background:#0d0d1a;border-radius:4px;overflow:hidden;}
.chart-fill{height:100%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:4px;}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#7c3aed;color:#fff;padding:12px 22px;border-radius:10px;font-family:monospace;font-size:13px;font-weight:700;z-index:999;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}

.empty{text-align:center;padding:50px 0;color:#3d2a5a;}
.empty .ico{font-size:44px;margin-bottom:12px;}
.empty p{font-style:italic;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>🎯 Зорилгын Зам</h1>
    <p>Зорилго бүр чамайг хүчирхэг болгоно</p>
  </div>

  <!-- Player -->
  <div class="player">
    <div class="player-row">
      <div class="avatar" id="av">🌱</div>
      <div class="player-info">
        <div class="player-title" id="ptitle">Шинэхэн Мөрөгч</div>
        <div class="player-sub" id="plevel">ТҮВШИН 1</div>
      </div>
    </div>
    <div class="xp-label"><span>⭐ ОНОО</span><strong id="pxp">0 / 100</strong></div>
    <div class="xp-track"><div class="xp-fill" id="pbar" style="width:0%"></div></div>
    <div class="badges-row" id="pbadges"></div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="showTab('goals',this)">🎯 Зорилго</button>
    <button class="tab" onclick="showTab('add',this)">➕ Нэмэх</button>
    <button class="tab" onclick="showTab('rewards',this)">🏆 Шагнал</button>
    <button class="tab" onclick="showTab('stats',this)">📊 Дүн</button>
  </div>

  <!-- GOALS -->
  <div id="panel-goals" class="panel active">
    <div id="goals-list"></div>
  </div>

  <!-- ADD -->
  <div id="panel-add" class="panel">
    <div class="add-box">
      <label>🎯 Зорилгын нэр</label>
      <input id="g-name" placeholder="Жишээ: Математикаар А авах..." />
      <label>📁 Ангилал</label>
      <input id="g-cat" placeholder="Жишээ: Хичээл, Биеийн тамир..." />
      <div class="row2">
        <div>
          <label>⭐ Оноо</label>
          <select id="g-pts">
            <option value="10">10 оноо</option>
            <option value="20">20 оноо</option>
            <option value="50" selected>50 оноо</option>
            <option value="100">100 оноо</option>
            <option value="200">200 оноо</option>
          </select>
        </div>
        <div>
          <label>📅 Хугацаа</label>
          <select id="g-days">
            <option value="7">7 хоног</option>
            <option value="14">14 хоног</option>
            <option value="30">1 сар</option>
            <option value="90">3 сар</option>
            <option value="365">1 жил</option>
            <option value="0">Хугацаагүй</option>
          </select>
        </div>
      </div>
      <label>📊 Нийт алхам (1-100)</label>
      <input id="g-steps" type="number" min="1" max="100" value="10" placeholder="10" />
      <button class="add-btn" onclick="addGoal()">✨ ЗОРИЛГО НЭМЭХ</button>
    </div>
  </div>

  <!-- REWARDS -->
  <div id="panel-rewards" class="panel">
    <div class="rewards-grid" id="rewards-grid"></div>
  </div>

  <!-- STATS -->
  <div id="panel-stats" class="panel">
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-n" id="st-total">0</div><div class="stat-l">нийт зорилго</div></div>
      <div class="stat-box"><div class="stat-n" id="st-done">0</div><div class="stat-l">биелсэн</div></div>
    </div>
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-n" id="st-pts">0</div><div class="stat-l">нийт оноо</div></div>
      <div class="stat-box"><div class="stat-n" id="st-pct">0%</div><div class="stat-l">дундаж явц</div></div>
    </div>
    <div class="chart-box">
      <div class="chart-title">Ангиллаар явц</div>
      <div id="cat-chart"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var RANKS = [
  {min:0,   name:"🌱 Шинэхэн Мөрөгч", av:"🌱", lv:1},
  {min:100, name:"🔥 Тэмцэгч",         av:"🔥", lv:2},
  {min:300, name:"⚡ Хүчтэн",          av:"⚡", lv:3},
  {min:600, name:"🌟 Одон Эзэмшигч",   av:"🌟", lv:4},
  {min:1000,name:"💎 Алмаз Мөрөгч",   av:"💎", lv:5},
  {min:2000,name:"👑 Аварга",          av:"👑", lv:6},
];

var REWARDS = [
  {id:1, icon:"🥉", name:"Хүрэл медаль",  pts:100},
  {id:2, icon:"🥈", name:"Мөнгөн медаль", pts:300},
  {id:3, icon:"🥇", name:"Алтан медаль",  pts:600},
  {id:4, icon:"🏆", name:"Аварга цом",    pts:1000},
  {id:5, icon:"💎", name:"Алмаз цол",     pts:2000},
  {id:6, icon:"👑", name:"Хаан титэм",    pts:3000},
];

var data = JSON.parse(localStorage.getItem("zorilgo_v1") || "null") || {pts:0, goals:[]};

function save(){ localStorage.setItem("zorilgo_v1", JSON.stringify(data)); }

function getRank(pts){
  var r = RANKS[0];
  for(var i=0;i<RANKS.length;i++){ if(pts>=RANKS[i].min) r=RANKS[i]; }
  return r;
}
function getNext(pts){
  for(var i=0;i<RANKS.length;i++){ if(RANKS[i].min>pts) return RANKS[i]; }
  return null;
}

function updatePlayer(){
  var pts = data.pts;
  var r = getRank(pts);
  var nx = getNext(pts);
  document.getElementById("av").textContent = r.av;
  document.getElementById("ptitle").textContent = r.name;
  document.getElementById("plevel").textContent = "ТҮВШИН " + r.lv;
  var pct = nx ? Math.round(((pts-r.min)/(nx.min-r.min))*100) : 100;
  document.getElementById("pbar").style.width = pct + "%";
  document.getElementById("pxp").textContent = pts + (nx ? " / " + nx.min : " (MAX)") + " оноо";
  document.getElementById("pbadges").innerHTML = RANKS.map(function(rk){
    return '<span class="badge '+(pts>=rk.min?"on":"off")+'">'+rk.av+" "+rk.name.split(" ").slice(1).join(" ")+'</span>';
  }).join("");
}

function showTab(name, btn){
  document.querySelectorAll(".panel").forEach(function(p){p.classList.remove("active");});
  document.querySelectorAll(".tab").forEach(function(b){b.classList.remove("active");});
  document.getElementById("panel-"+name).classList.add("active");
  btn.classList.add("active");
  if(name==="goals") renderGoals();
  if(name==="rewards") renderRewards();
  if(name==="stats") renderStats();
}

function addGoal(){
  var name = document.getElementById("g-name").value.trim();
  if(!name){ showToast("Зорилгын нэр бичнэ үү!"); return; }
  var days = parseInt(document.getElementById("g-days").value);
  var deadline = days ? new Date(Date.now()+days*86400000).toLocaleDateString("mn-MN") : "Хугацаагүй";
  var steps = Math.max(1, parseInt(document.getElementById("g-steps").value)||10);
  data.goals.unshift({
    id: Date.now(),
    name: name,
    cat: document.getElementById("g-cat").value.trim() || "Ерөнхий",
    pts: parseInt(document.getElementById("g-pts").value),
    deadline: deadline,
    steps: steps,
    done_steps: 0,
    finished: false,
    created: new Date().toLocaleDateString("mn-MN")
  });
  save();
  document.getElementById("g-name").value = "";
  document.getElementById("g-cat").value = "";
  showToast("✨ Зорилго нэмэгдлээ!");
  showTab("goals", document.querySelectorAll(".tab")[0]);
}

function renderGoals(){
  var el = document.getElementById("goals-list");
  if(!data.goals.length){
    el.innerHTML = '<div class="empty"><div class="ico">🎯</div><p>Зорилго байхгүй байна.<br>Шинэ зорилго нэм!</p></div>';
    return;
  }
  el.innerHTML = data.goals.map(function(g){
    var pct = Math.round((g.done_steps/g.steps)*100);
    return '<div class="goal-card'+(g.finished?" goal-done":"")+'">'+
      (g.finished?'<div class="done-stamp">✅ БИЕЛСЭН</div>':'')+
      '<div class="goal-top">'+
        '<div class="goal-title">🎯 '+g.name+'</div>'+
        '<div class="goal-pts">+'+g.pts+' ⭐</div>'+
      '</div>'+
      '<div class="goal-meta">'+
        '<span class="goal-tag">📁 '+g.cat+'</span>'+
        '<span class="goal-deadline">📅 '+g.deadline+'</span>'+
      '</div>'+
      '<div class="goal-prog-label"><span>Явц: '+g.done_steps+'/'+g.steps+'</span><strong>'+pct+'%</strong></div>'+
      '<div class="prog-track"><div class="prog-fill" style="width:'+pct+'%"></div></div>'+
      (!g.finished?
        '<div class="goal-btns">'+
          '<button class="btn-plus" onclick="stepGoal('+g.id+',1)">▲ Нэмэх</button>'+
          (g.done_steps>0?'<button class="btn-minus" onclick="stepGoal('+g.id+',-1)">▼</button>':'')+
          '<button class="btn-del" onclick="delGoal('+g.id+')">🗑</button>'+
        '</div>'
      :'<div style="text-align:center;color:#4ade80;font-family:monospace;font-size:12px;margin-top:8px;">Баяр хүргэе! 🎉</div>')+
    '</div>';
  }).join("");
}

function stepGoal(id, dir){
  var g = data.goals.find(function(g){return g.id===id;});
  g.done_steps = Math.max(0, Math.min(g.steps, g.done_steps+dir));
  if(g.done_steps===g.steps && !g.finished){
    g.finished = true;
    data.pts += g.pts;
    var oldR = getRank(data.pts - g.pts);
    var newR = getRank(data.pts);
    showToast("🎉 +"+g.pts+" оноо авлаа!");
    if(newR.lv > oldR.lv) setTimeout(function(){showToast("🌟 "+newR.name+" боллоо!");},1500);
  }
  save(); renderGoals(); updatePlayer();
}

function delGoal(id){
  if(!confirm("Устгах уу?")) return;
  var g = data.goals.find(function(g){return g.id===id;});
  if(g.finished) data.pts = Math.max(0, data.pts - g.pts);
  data.goals = data.goals.filter(function(g){return g.id!==id;});
  save(); renderGoals(); updatePlayer();
}

function renderRewards(){
  document.getElementById("rewards-grid").innerHTML = REWARDS.map(function(r){
    var unlocked = data.pts >= r.pts;
    return '<div class="reward-card'+(unlocked?" unlocked":"")+'">'+
      '<div class="reward-lock">'+(unlocked?"":"🔒")+'</div>'+
      '<div class="reward-icon">'+r.icon+'</div>'+
      '<div class="reward-name">'+r.name+'</div>'+
      '<div class="reward-pts">'+(unlocked?"✅ Нээгдсэн":r.pts+" оноо")+'</div>'+
    '</div>';
  }).join("");
}

function renderStats(){
  var goals = data.goals;
  var done = goals.filter(function(g){return g.finished;}).length;
  var avgPct = goals.length ? Math.round(goals.reduce(function(a,g){return a+Math.round(g.done_steps/g.steps*100);},0)/goals.length) : 0;
  document.getElementById("st-total").textContent = goals.length;
  document.getElementById("st-done").textContent = done;
  document.getElementById("st-pts").textContent = data.pts;
  document.getElementById("st-pct").textContent = avgPct+"%";
  var cats = {};
  goals.forEach(function(g){
    if(!cats[g.cat]) cats[g.cat]={total:0,done:0};
    cats[g.cat].total++;
    if(g.finished) cats[g.cat].done++;
  });
  var chart = document.getElementById("cat-chart");
  var keys = Object.keys(cats);
  if(!keys.length){ chart.innerHTML='<div style="color:#3d2a5a;font-style:italic;font-size:13px">Зорилго нэмээрэй...</div>'; return; }
  chart.innerHTML = keys.map(function(k){
    var pct = Math.round(cats[k].done/cats[k].total*100);
    return '<div class="chart-row">'+
      '<div class="chart-lbl"><span>📁 '+k+'</span><strong>'+pct+'%</strong></div>'+
      '<div class="chart-track"><div class="chart-fill" style="width:'+pct+'%"></div></div>'+
    '</div>';
  }).join("");
}

function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){t.classList.remove("show");},2200);
}

renderGoals();
updatePlayer();
</script>
</body>
</html>
